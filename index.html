<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuidapp</title>
<meta name="description" content="Cuidapp: cuidado de personas mayores a domicilio. Versión web.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=block">
<style>
/* ------------------------------------------------------------------ page */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(1200px 800px at 25% 15%,#1d2d26 0%,#0c110f 65%);
  color:#e3e9e5;min-height:100vh;
}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:40px;padding:28px 20px;flex-wrap:wrap}

/* ------------------------------------------------------------------ phone */
.phone{
  position:relative;width:390px;height:812px;flex:none;
  border-radius:48px;background:#0b0d0c;padding:11px;
  box-shadow:0 40px 90px rgba(0,0,0,.65),0 0 0 1px #2b3230,inset 0 0 0 2px #1b1f1d;
}
.phone::after{
  content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);
  width:110px;height:26px;border-radius:14px;background:#0b0d0c;z-index:5;
}
.phone-inner{
  position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;
  background:var(--surface);color:var(--on-surface);display:flex;flex-direction:column;
}
.statusbar{
  height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:12px 26px 0;font-size:14px;font-weight:600;letter-spacing:.2px;
}
.statusbar .ms{font-size:17px}
.statusbar .right{display:flex;gap:4px;align-items:center}
.screen{flex:1;min-height:0;position:relative;overflow:hidden}

/* ------------------------------------------------------- Material 3 tokens */
.phone-inner{
  --primary:#1F6F55;--on-primary:#FFFFFF;--primary-container:#A8F2D2;--on-primary-container:#00201A;
  --secondary:#4C6358;--on-secondary:#FFFFFF;--secondary-container:#CEE9DA;--on-secondary-container:#092017;
  --tertiary:#3E6374;--on-tertiary:#FFFFFF;--tertiary-container:#C1E8FB;--on-tertiary-container:#001F2A;
  --error:#BA1A1A;--on-error:#FFFFFF;--error-container:#FFDAD6;--on-error-container:#410002;
  --surface:#F5FBF5;--on-surface:#171D1A;--on-surface-variant:#3F4943;
  --surface-container-lowest:#FFFFFF;--surface-container-low:#EFF5F0;--surface-container:#E9EFEA;
  --surface-container-high:#E4EAE4;--surface-container-highest:#DEE4DE;
  --outline:#6F7972;--outline-variant:#BEC9C1;
  --inverse-surface:#2C322E;--inverse-on-surface:#ECF2EC;
  --scrim:rgba(0,0,0,.32);
}
.phone-inner[data-theme="dark"]{
  --primary:#8CD5B7;--on-primary:#003828;--primary-container:#00513B;--on-primary-container:#A8F2D2;
  --secondary:#B2CCBE;--on-secondary:#1E352B;--secondary-container:#354B41;--on-secondary-container:#CEE9DA;
  --tertiary:#A6CCDE;--on-tertiary:#093544;--tertiary-container:#254B5C;--on-tertiary-container:#C1E8FB;
  --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
  --surface:#0F1512;--on-surface:#DEE4DF;--on-surface-variant:#BEC9C1;
  --surface-container-lowest:#0A0F0D;--surface-container-low:#171D1A;--surface-container:#1B211E;
  --surface-container-high:#252B28;--surface-container-highest:#303633;
  --outline:#89938C;--outline-variant:#3F4943;
  --inverse-surface:#DEE4DF;--inverse-on-surface:#2C322E;
  --scrim:rgba(0,0,0,.5);
}

/* ------------------------------------------------------------------ icons */
.ms{
  font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:24px;
  line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;
  direction:ltr;-webkit-font-smoothing:antialiased;font-feature-settings:'liga';
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;flex:none;
}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}

/* ------------------------------------------------------------- typography */
.headline-m{font-size:28px;line-height:36px;font-weight:400;margin:0}
.headline-s{font-size:24px;line-height:32px;font-weight:400;margin:0}
.title-l{font-size:22px;line-height:28px;font-weight:400}
.title-m{font-size:16px;line-height:24px;font-weight:500;letter-spacing:.15px}
.body-l{font-size:16px;line-height:24px;letter-spacing:.5px}
.body-m{font-size:14px;line-height:20px;letter-spacing:.25px;margin:0}
.body-s{font-size:12px;line-height:16px;letter-spacing:.4px;margin:0}
.label-m{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px}
.label-s{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.5px}
.bold{font-weight:700}
.muted{color:var(--on-surface-variant)}
.center{text-align:center}
.primary{color:var(--primary)}

/* ------------------------------------------------------------------ layout */
.route{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--surface)}
.route.anim{animation:route-in .2s ease-out}
@keyframes route-in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.route.black{background:#000;color:#fff}
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.body.center{display:flex;align-items:center;justify-content:center}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}.gap24{gap:24px}
.spacer{flex:1}
.right{display:flex;justify-content:flex-end}

/* ------------------------------------------------------------------ appbar */
.appbar{height:64px;flex:none;display:flex;align-items:center;padding:0 4px;background:var(--surface);transition:background .2s}
.appbar.scrolled{background:var(--surface-container)}
.appbar.black,.appbar.black.scrolled{background:#000;color:#fff}
.appbar .title{flex:1;font-size:22px;line-height:28px;padding-left:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .title.noleading{padding-left:16px}
.appbar .actions{display:flex;align-items:center}
.iconbtn{
  width:48px;height:48px;border-radius:50%;border:0;background:transparent;color:var(--on-surface-variant);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:0;flex:none;
}
.iconbtn:hover{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.iconbtn:active{background:color-mix(in srgb,var(--on-surface) 12%,transparent)}
.iconbtn:disabled{color:color-mix(in srgb,var(--on-surface) 38%,transparent);cursor:default;background:transparent}
.appbar.black .iconbtn{color:#fff}
.badge{
  position:absolute;top:6px;left:26px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:var(--error);color:var(--on-error);font-size:11px;line-height:16px;font-weight:500;
}

/* ------------------------------------------------------------------- cards */
.card{background:var(--surface-container-low);border:1px solid var(--outline-variant);border-radius:16px;margin:4px;overflow:hidden}
.tile{display:flex;align-items:center;gap:16px;padding:12px 16px;min-height:56px;cursor:pointer;user-select:none}
.tile:hover{background:color-mix(in srgb,var(--on-surface) 6%,transparent)}
.tile.static{cursor:default}
.tile.static:hover{background:transparent}
.tile .lead{width:40px;display:flex;justify-content:center;align-items:center;color:var(--on-surface-variant);flex:none}
.tile .text{flex:1;min-width:0}
.tile .t{font-size:16px;line-height:24px;letter-spacing:.5px}
.tile .s{font-size:14px;line-height:20px;letter-spacing:.25px;color:var(--on-surface-variant)}
.tile .trail{display:flex;align-items:center;color:var(--on-surface-variant);flex:none}
.pill{
  margin-right:8px;padding:3px 8px;border-radius:12px;background:var(--error);color:var(--on-error);
  font-size:11px;line-height:16px;font-weight:700;letter-spacing:.5px;
}
.avatar{
  width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;
  background:var(--primary-container);color:var(--on-primary-container);
}
.avatar.off{background:var(--surface-container-highest);color:var(--outline)}

/* ----------------------------------------------------------------- buttons */
.btn{
  font:500 14px/20px Roboto,system-ui,sans-serif;letter-spacing:.1px;border-radius:100px;height:40px;padding:0 24px;
  border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
  transition:background .15s,box-shadow .15s;
}
.btn .ms{font-size:18px}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.filled:hover{box-shadow:0 1px 3px rgba(0,0,0,.3)}
.btn.filled:disabled{background:color-mix(in srgb,var(--on-surface) 12%,transparent);color:color-mix(in srgb,var(--on-surface) 38%,transparent);cursor:default;box-shadow:none}
.btn.outlined{background:transparent;color:var(--primary);border:1px solid var(--outline)}
.btn.outlined:hover{background:color-mix(in srgb,var(--primary) 8%,transparent)}
.btn.outlined:disabled{color:color-mix(in srgb,var(--on-surface) 38%,transparent);border-color:color-mix(in srgb,var(--on-surface) 12%,transparent);cursor:default}
.btn.text{background:transparent;color:var(--primary);padding:0 12px}
.btn.text:hover{background:color-mix(in srgb,var(--primary) 8%,transparent)}
.btn.text:disabled{color:color-mix(in srgb,var(--on-surface) 38%,transparent);cursor:default;background:transparent}
.btn.block{width:100%}
.btn.tall{height:52px}
.btn.h48{height:48px}
.btn.icon-filled{width:50px;height:50px;padding:0;border-radius:50%;background:var(--primary);color:var(--on-primary);flex:none}
.btn.icon-filled .ms{font-size:22px}

/* ------------------------------------------------------------- text fields */
.field{position:relative;margin-bottom:16px}
.field .box{
  display:flex;align-items:center;height:56px;border:1px solid var(--outline);border-radius:4px;
  background:var(--surface-container-highest);padding:0 12px;gap:12px;transition:border-color .12s;
}
.field.focus .box{border:2px solid var(--primary);padding:0 11px}
.field.error .box{border-color:var(--error)}
.field .prefix{color:var(--on-surface-variant);font-size:24px}
.field.focus .prefix{color:var(--primary)}
.field.error .prefix{color:var(--error)}
.field input{flex:1;border:0;background:transparent;outline:0;font:400 16px/24px Roboto,system-ui,sans-serif;color:var(--on-surface);min-width:0;padding:0}
.field input:disabled{color:color-mix(in srgb,var(--on-surface) 38%,transparent)}
.field label{
  position:absolute;left:48px;top:16px;font-size:16px;line-height:24px;color:var(--on-surface-variant);
  pointer-events:none;transition:all .14s ease-out;padding:0 4px;margin-left:-4px;
}
.field.focus label,.field.float label{
  top:-8px;left:12px;font-size:12px;line-height:16px;
  background:linear-gradient(to bottom,var(--field-above,var(--surface)) 50%,var(--surface-container-highest) 50%);
}
.field.focus label{color:var(--primary)}
.field.error label{color:var(--error)}
.field .suffix{margin-right:-8px;width:40px;height:40px}
.field .helper{font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--error);padding:4px 16px 0}
.field .hint{font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--on-surface-variant);padding:4px 16px 0}

/* --------------------------------------------------------------- checkbox */
.cbwrap{width:48px;height:48px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;border-radius:50%}
.cbwrap:hover{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.cbwrap.off{cursor:default}
.cbwrap.off:hover{background:transparent}
.cb{width:18px;height:18px;border:2px solid var(--on-surface-variant);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;transition:background .12s}
.cb.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.cb .ms{font-size:16px;font-variation-settings:'FILL' 0,'wght' 700,'GRAD' 0,'opsz' 20}

/* --------------------------------------------------------------- progress */
.progress{height:10px;border-radius:8px;background:var(--surface-container-highest);overflow:hidden;flex:1}
.progress.thin{height:8px}
.progress>i{display:block;height:100%;background:var(--primary);border-radius:8px;transition:width .35s ease}
.spinner{
  width:36px;height:36px;border-radius:50%;border:4px solid color-mix(in srgb,var(--primary) 20%,transparent);
  border-top-color:var(--primary);animation:spin .9s linear infinite;flex:none;
}
.spinner.small{width:22px;height:22px;border-width:2px;border-color:color-mix(in srgb,var(--on-surface) 12%,transparent);border-top-color:var(--primary)}
.spinner.white{border-color:rgba(255,255,255,.25);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}

/* --------------------------------------------------------------- segmented */
.seg{display:flex;border:1px solid var(--outline);border-radius:100px;overflow:hidden;height:40px;margin:12px 12px 0}
.seg button{
  flex:1;border:0;background:transparent;color:var(--on-surface);font:500 14px/20px Roboto,system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:0 12px;
}
.seg button+button{border-left:1px solid var(--outline)}
.seg button.on{background:var(--secondary-container);color:var(--on-secondary-container)}
.seg button .ms{font-size:16px}

/* ------------------------------------------------------------------- tasks */
.cat-header{padding:20px 20px 4px;display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.cat-header .ms{font-size:18px}
.cat-header .count{margin-left:auto;font-weight:500;letter-spacing:.5px;color:var(--outline);text-transform:none}
.task{display:flex;align-items:center;padding:4px 8px}
.task.disabled{opacity:.5}
.task .content{flex:1;min-width:0;padding:8px 0}
.task .title{font-size:16px;line-height:24px;letter-spacing:.5px}
.task .title.resolved{text-decoration:line-through;color:var(--outline)}
.task .title.critical{font-weight:600}
.task .chips{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:12px;line-height:16px;letter-spacing:.4px}
.task .chip{display:inline-flex;align-items:center;gap:4px}
.task .chip .ms{font-size:14px}
.task .note{margin-top:4px;font-style:italic;font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--on-surface-variant);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task .secondary{display:flex;align-items:center;flex:none}
.task .secondary .cat{font-size:22px}
.empty{padding:32px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ms{font-size:56px;color:var(--outline);margin-bottom:8px}
.empty .ms.err{color:var(--error)}

/* -------------------------------------------------------------------- chat */
.chat-list{min-height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:12px 0}
.day-sep{display:flex;justify-content:center;padding:12px 0}
.day-sep span{padding:4px 12px;border-radius:12px;background:var(--surface-container-highest);font-size:11px;line-height:16px;font-weight:500;letter-spacing:.5px}
.sys-msg{padding:8px 24px;text-align:center;font-size:12px;line-height:16px;font-style:italic;color:var(--on-surface-variant)}
.bubble-row{display:flex;padding:2px 12px}
.bubble-row.mine{justify-content:flex-end}
.bubble{
  max-width:78%;padding:10px 14px;border-radius:16px 16px 16px 4px;background:var(--surface-container-highest);
  color:var(--on-surface);font-size:14px;line-height:20px;letter-spacing:.25px;word-wrap:break-word;white-space:pre-wrap;
}
.mine .bubble{background:var(--primary-container);color:var(--on-primary-container);border-radius:16px 16px 4px 16px}
.bubble .sender{font-size:11px;line-height:16px;font-weight:700;letter-spacing:.5px;color:var(--primary);margin-bottom:2px}
.bubble .meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-top:2px;font-size:11px;line-height:16px;font-weight:500;letter-spacing:.5px}
.bubble .meta .time{opacity:.6}
.bubble .meta .ms{font-size:14px;opacity:.6}
.bubble .meta .ms.read{color:var(--primary);opacity:1}
.composer{
  flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 12px;background:var(--surface);
  box-shadow:0 -3px 10px rgba(0,0,0,.14);position:relative;z-index:2;
}
.composer .tbox{flex:1;border:1px solid var(--outline);border-radius:4px;background:var(--surface-container-highest);display:flex}
.composer .tbox.focus{border:2px solid var(--primary)}
.composer textarea{
  flex:1;border:0;background:transparent;outline:0;resize:none;font:400 16px/24px Roboto,system-ui,sans-serif;
  color:var(--on-surface);padding:12px 16px;min-height:48px;max-height:144px;
}
.composer textarea::placeholder{color:var(--on-surface-variant)}

/* -------------------------------------------------------------- camera live */
.video-wrap{width:100%;aspect-ratio:16/9;position:relative;background:#000;overflow:hidden}
.video-wrap canvas{width:100%;height:100%;display:block}
.video-wrap .scan{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);pointer-events:none}
.video-wrap .hud{position:absolute;left:10px;top:8px;display:flex;align-items:center;gap:6px;font:600 11px/14px Roboto,monospace;color:#fff;text-shadow:0 1px 2px #000;letter-spacing:.6px}
.video-wrap .hud i{width:8px;height:8px;border-radius:50%;background:#ff3b30;animation:blink 1.2s steps(2) infinite}
.video-wrap .ts{position:absolute;right:10px;top:8px;font:500 11px/14px "Roboto Mono",Consolas,monospace;color:#fff;text-shadow:0 1px 2px #000}
.video-wrap .foot{position:absolute;left:10px;bottom:8px;font:400 10px/12px Roboto,sans-serif;color:rgba(255,255,255,.55)}
@keyframes blink{50%{opacity:0}}

/* -------------------------------------------------------- snackbar + sheet */
.snackbar{
  position:absolute;left:16px;right:16px;bottom:16px;background:var(--inverse-surface);color:var(--inverse-on-surface);
  padding:14px 16px;border-radius:4px;font-size:14px;line-height:20px;letter-spacing:.25px;
  transform:translateY(24px);opacity:0;transition:.2s;pointer-events:none;box-shadow:0 3px 8px rgba(0,0,0,.35);z-index:40;
}
.snackbar.show{transform:none;opacity:1}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:30;display:none;align-items:flex-end}
.scrim.show{display:flex}
.sheet{
  width:100%;background:var(--surface-container-low);border-radius:28px 28px 0 0;padding:20px;
  animation:sheet-up .22s ease-out;--field-above:var(--surface-container-low);
}
@keyframes sheet-up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet textarea{
  width:100%;border:1px solid var(--outline);border-radius:4px;background:var(--surface-container-highest);
  font:400 16px/24px Roboto,system-ui,sans-serif;color:var(--on-surface);padding:12px 16px;resize:none;outline:0;height:120px;
}
.sheet textarea:focus{border:2px solid var(--primary);padding:11px 15px}
.sheet textarea::placeholder{color:var(--on-surface-variant)}
.sheet .counter{text-align:right;font-size:12px;line-height:16px;color:var(--on-surface-variant);padding:4px 16px 0}

/* ------------------------------------------------------------- demo panel */
.demo-panel{width:360px;max-width:100%;color:#dfe6e1}
.demo-panel h1{font-size:26px;margin:0 0 4px;font-weight:700;color:#fff;display:flex;align-items:baseline;gap:10px}
.demo-panel h1 small{font-size:13px;font-weight:500;color:#8cd5b7;letter-spacing:.6px;text-transform:uppercase}
.demo-panel h2{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#8cd5b7;margin:22px 0 8px;font-weight:600}
.demo-panel p{font-size:14px;line-height:21px;margin:0 0 8px;color:#b9c4bd}
.demo-panel table{border-collapse:collapse;width:100%;font-size:14px}
.demo-panel td{padding:6px 8px 6px 0;border-bottom:1px solid #26302b;color:#dfe6e1;vertical-align:top}
.demo-panel td:first-child{color:#8fa39a;width:92px}
.demo-panel code{font-family:Consolas,"Roboto Mono",monospace;font-size:13px;color:#fff;background:#1f2925;padding:1px 6px;border-radius:4px}
.demo-panel .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.demo-panel button{
  font:500 13px/18px Roboto,system-ui,sans-serif;padding:8px 14px;border-radius:100px;border:1px solid #37453e;
  background:#16201b;color:#e6ece8;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
}
.demo-panel button:hover{background:#1f2c25;border-color:#4d5e55}
.demo-panel button.accent{background:#1F6F55;border-color:#1F6F55;color:#fff}
.demo-panel button.accent:hover{background:#268a69}
.demo-panel .ms{font-size:18px}
.demo-panel .status{font-size:13px;color:#8fa39a;margin-top:14px}
.demo-panel .status b{color:#fff;font-weight:600}
.demo-panel .warn{background:#2a2114;border:1px solid #5a4620;border-radius:12px;padding:12px 14px;margin-top:12px}
.demo-panel .warn p{color:#f0d9a6;margin:0 0 8px}
.mode{display:inline-flex;align-items:center;gap:6px;font:600 12px/16px Roboto,sans-serif;letter-spacing:.4px;padding:4px 10px;border-radius:100px;margin-top:6px}
.mode.local{background:#2b2418;color:#f0d9a6;border:1px solid #5a4620}

<!-- Configuración de Firebase. Si `window.CUIDAPP_FIREBASE` es null, la app funciona en modo demo local. -->
<script src="firebase-config.js"></script>
<script>
(() => {
'use strict';

/* ================================================================== utils */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const fmtHm = ms => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const todayStr = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const atTime = (hhmm, base = new Date(), dayOffset = 0) => {
  const [h, m] = hhmm.split(':').map(Number);
  const d = new Date(base); d.setDate(d.getDate() + dayOffset); d.setHours(h, m, 0, 0); return d.getTime();
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const icon = (name, o = {}) =>
  `<span class="ms${o.fill ? ' fill' : ''}${o.cls ? ' ' + o.cls : ''}" style="${o.size ? `font-size:${o.size}px;` : ''}${o.color ? `color:${o.color};` : ''}">${name}</span>`;

/* ============================================================ constantes */
const FIREBASE_CDN = 'https://www.gstatic.com/firebasejs/12.17.1/';
const FIREBASE_CONFIG = (window.CUIDAPP_FIREBASE && window.CUIDAPP_FIREBASE.apiKey) ? window.CUIDAPP_FIREBASE : null;
/** Un usuario sin "@" se convierte en `usuario@<dominio>`: Firebase Auth exige un correo. */
const USERNAME_DOMAIN = String(window.CUIDAPP_USERNAME_DOMAIN || 'cuidapp.ggabor.online').toLowerCase();
const ELDER_ID = 'elder_carmen';
const ELDER_NAME = 'Carmen Ferrer';

const CATEGORY = {
  medication:    { label: 'Medicación', icon: 'medication',        color: '#D64545' },
  meal:          { label: 'Comidas',    icon: 'restaurant',        color: '#E08A00' },
  hygiene:       { label: 'Aseo',       icon: 'shower',            color: '#2A9D8F' },
  cleaning:      { label: 'Limpieza',   icon: 'cleaning_services', color: '#5B8DEF' },
  mobility:      { label: 'Movilidad',  icon: 'directions_walk',   color: '#7B5EA7' },
  companionship: { label: 'Compañía',   icon: 'chat_bubble',       color: '#CC6699' },
  other:         { label: 'Otros',      icon: 'checklist',         color: 'var(--outline)' },
};

function toEmail(login) {
  const v = String(login || '').trim().toLowerCase();
  if (!v) return '';
  return v.includes('@') ? v : `${v}@${USERNAME_DOMAIN}`;
}
function loginError(login) {
  const v = String(login || '').trim().toLowerCase();
  if (!v) return 'Introduce tu usuario o correo';
  if (v.includes('@')) return v.includes('.') ? null : 'Correo no válido';
  return /^[a-z0-9._-]{2,}$/.test(v) ? null : 'Usuario no válido';
}
const isProvisioned = u => !!u && u.role !== 'unknown' && u.elderIds.length > 0;

/** Copia de pickActiveShift() de shift.dart */
function pickActiveShift(shifts, now) {
  if (!shifts.length) return null;
  for (const s of shifts) if (s.status === 'in_progress') return s;
  for (const s of shifts) {
    if (s.status === 'completed') continue;
    if (s.scheduledEnd == null || now < s.scheduledEnd) return s;
  }
  return shifts[shifts.length - 1];
}
const isOverdue = (t, now) => t.status === 'pending' && t.scheduledAt != null && now > t.scheduledAt;

/* ====================================================== backend: local */
// Mismo cuadrante y plan de cuidados que functions/scripts/seed.mjs
const ASSIGNMENTS = [
  { id: 'turno_manana', start: '09:00', end: '14:00' },
  { id: 'turno_tarde',  start: '16:30', end: '19:00' },
];
const CARE_PLAN = [
  { id: 'med_manana', title: 'Medicación de la mañana',   category: 'medication',    order: 1, timeOfDay: '09:30', isCritical: true, requiresPhoto: true },
  { id: 'desayuno',   title: 'Preparar el desayuno',      category: 'meal',          order: 2, timeOfDay: '09:45' },
  { id: 'aseo',       title: 'Aseo personal y vestido',   category: 'hygiene',       order: 3, timeOfDay: '10:15' },
  { id: 'paseo',      title: 'Paseo de 20 minutos',       category: 'mobility',      order: 4, timeOfDay: '11:00' },
  { id: 'limpieza',   title: 'Limpieza de cocina y baño', category: 'cleaning',      order: 5 },
  { id: 'comida',     title: 'Preparar la comida',        category: 'meal',          order: 6, timeOfDay: '13:30' },
  { id: 'med_tarde',  title: 'Medicación de la tarde',    category: 'medication',    order: 7, timeOfDay: '17:00', isCritical: true, requiresPhoto: true },
  { id: 'compania',   title: 'Conversación y compañía',   category: 'companionship', order: 8, timeOfDay: '17:30' },
];
const LOCAL_USERS = [
  { uid: 'family_test',   email: `test@${USERNAME_DOMAIN}`, password: 'cuidapp123', displayName: 'Usuario de prueba', role: 'family',    elderIds: [ELDER_ID] },
  { uid: 'family_lucia',  email: 'lucia@example.com',        password: 'test1234',   displayName: 'Lucía Ferrer',      role: 'family',    elderIds: [ELDER_ID] },
  { uid: 'caregiver_ana', email: 'ana@example.com',          password: 'test1234',   displayName: 'Ana Ruiz',          role: 'caregiver', elderIds: [ELDER_ID] },
];

/** Reparto de plantillas entre turnos: copia de templatesForAssignment() de generate-shifts.ts */
function templatesFor(assignment) {
  const isFirst = ASSIGNMENTS[0].id === assignment.id;
  const isLast = ASSIGNMENTS[ASSIGNMENTS.length - 1].id === assignment.id;
  return CARE_PLAN.filter(t => {
    if (!t.timeOfDay) return isFirst;
    const fits = t.timeOfDay >= assignment.start && t.timeOfDay <= assignment.end;
    if (fits) return true;
    const anywhere = ASSIGNMENTS.some(a => t.timeOfDay >= a.start && t.timeOfDay <= a.end);
    return !anywhere && isLast;
  });
}

/** Genera el estado del día. Es "consciente de la hora" para que la demo sea coherente a cualquier hora. */
function seedLocal() {
  const now = new Date();
  const h = now.getHours() + now.getMinutes() / 60;
  const T = hhmm => atTime(hhmm, now);
  const hOf = hhmm => { const [a, b] = hhmm.split(':').map(Number); return a + b / 60; };
  const users = {};
  for (const u of LOCAL_USERS) users[u.email] = { ...u };

  const shifts = ASSIGNMENTS.map((a, i) => {
    const isMorning = i === 0;
    let status = 'scheduled', checkInAt = null, checkOutAt = null;
    if (isMorning) {
      if (h >= 9.04) { status = 'in_progress'; checkInAt = T('09:02'); }
      if (h >= 14)   { status = 'completed';   checkOutAt = T('13:58'); }
    } else if (h >= 16.56) { status = 'in_progress'; checkInAt = T('16:33'); }

    const tasks = templatesFor(a).map(t => {
      let done = false;
      if (status === 'completed') done = true;
      else if (status === 'in_progress') done = t.timeOfDay ? h >= hOf(t.timeOfDay) + 0.12 : h >= 12.2;
      if (!isMorning && t.id === 'compania') done = false; // siempre queda algo por hacer en la demo
      const completedAt = done ? (t.timeOfDay ? T(t.timeOfDay) + 6 * 60000 : T('12:10')) : null;
      let note = null;
      if (done && t.id === 'aseo')   note = 'Hoy ha querido ducharse ella sola; solo he ayudado con el pelo.';
      if (done && t.id === 'comida') note = 'Ha comido bastante bien. Ha dejado un poco de verdura.';
      return {
        id: t.id, title: t.title, category: t.category, order: t.order,
        status: done ? 'done' : 'pending',
        scheduledAt: t.timeOfDay ? T(t.timeOfDay) : null,
        completedAt, completedBy: done ? 'caregiver_ana' : null,
        note, photoUrl: (done && t.requiresPhoto) ? 'demo' : null,
        requiresPhoto: !!t.requiresPhoto, isCritical: !!t.isCritical,
      };
    });
    return {
      id: `${ELDER_ID}_${todayStr(now)}_${a.id}`, elderId: ELDER_ID, elderName: ELDER_NAME,
      caregiverUid: 'caregiver_ana', assignmentId: a.id, date: todayStr(now), status,
      total: tasks.length, done: tasks.filter(t => t.status === 'done').length,
      scheduledStart: T(a.start), scheduledEnd: T(a.end), checkInAt, checkOutAt, tasks,
    };
  });

  const L = users['lucia@example.com'], A = users['ana@example.com'];
  const raw = [
    { day: -1, t: '18:40', from: L, text: 'Hola Ana, el jueves viene el fisio a las 12. ¿Puedes tenerla lista y desayunada para entonces?' },
    { day: -1, t: '18:52', from: A, text: 'Claro, la tendré vestida y desayunada antes. ¿Le doy la medicación antes o después?' },
    { day: -1, t: '18:55', from: L, text: 'Antes, como siempre. ¡Gracias!' },
    { day: 0, t: '09:02', system: 'Ana Ruiz ha fichado la entrada a las 09:02', when: h >= 9.04 },
    { day: 0, t: '09:58', from: A, text: 'Buenos días. Carmen ha desayunado bien y ya tiene la medicación tomada 👍', when: h >= 10, unread: true },
    { day: 0, t: '10:41', from: A, text: 'Se ha quejado un poco de la rodilla al levantarse. Le he puesto la crema y hemos hecho el paseo corto.', when: h >= 10.75, unread: true },
    { day: 0, t: '13:58', system: 'Ana Ruiz ha fichado la salida a las 13:58', when: h >= 14 },
    { day: 0, t: '16:33', system: 'Ana Ruiz ha fichado la entrada a las 16:33', when: h >= 16.56 },
  ];
  const messages = []; let n = 0;
  for (const m of raw) {
    if (m.when === false) continue;
    const sentAt = atTime(m.t, now, m.day);
    if (m.system) {
      messages.push({ id: 'm' + (++n), senderUid: 'system', senderName: 'Sistema', type: 'system', text: m.system, readBy: [], sentAt });
    } else {
      // Los familiares (Lucía y la cuenta de prueba) tienen sin leer los mensajes de hoy de Ana.
      const readBy = m.unread ? [m.from.uid] : [L.uid, A.uid, 'family_test'];
      messages.push({ id: 'm' + (++n), senderUid: m.from.uid, senderName: m.from.displayName, type: 'text', text: m.text, readBy, sentAt });
    }
  }
  return {
    date: todayStr(now), users, shifts,
    cameras: [
      { id: 'cam_salon',   label: 'Salón',   status: 'online', hasAudio: true, supportsTwoWayAudio: true },
      { id: 'cam_pasillo', label: 'Pasillo', status: 'online', hasAudio: true, supportsTwoWayAudio: false },
    ],
    conversation: { id: 'conv_' + ELDER_ID, messages },
  };
}

class LocalBackend {
  constructor(onChange) {
    this.mode = 'local';
    this.onChange = onChange;
    this.loading = true;
    this.errors = {};
    this.STORAGE_KEY = 'cuidapp_demo_v2';
    this.SESSION_KEY = 'cuidapp_demo_session_v2';
    this.db = null; this.session = {};
  }
  async init() {
    try {
      const stored = JSON.parse(localStorage.getItem(this.STORAGE_KEY) || 'null');
      this.db = (stored && stored.date === todayStr()) ? stored : seedLocal();
    } catch { this.db = seedLocal(); }
    try { this.session = JSON.parse(localStorage.getItem(this.SESSION_KEY) || 'null') || {}; } catch { this.session = {}; }
    this.session.userEmail ??= null;
    this.save();
    await sleep(900); // splash, como la resolución de sesión de Firebase
    this.loading = false;
    this.onChange();
  }
  save() {
    try {
      localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.db));
      localStorage.setItem(this.SESSION_KEY, JSON.stringify(this.session));
    } catch {}
  }
  reset() { this.db = seedLocal(); this.save(); this.onChange(); }
  currentUser() { return this.session.userEmail ? (this.db.users[this.session.userEmail] || null) : null; }
  findUser(login) {
    const email = toEmail(login);
    if (this.db.users[email]) return this.db.users[email];
    const name = String(login).trim().toLowerCase();
    if (!name.includes('@')) return Object.values(this.db.users).find(u => u.email.split('@')[0] === name) || null;
    return null;
  }
  async signIn(login, password) {
    await sleep(650);
    const u = this.findUser(login);
    if (!u || u.password !== password) throw new Error('Usuario o contraseña incorrectos.');
    this.session.userEmail = u.email; this.save(); this.onChange();
  }
  async register(name, login, password) {
    await sleep(650);
    const email = toEmail(login);
    if (this.db.users[email]) throw new Error('Ya existe una cuenta con ese correo.');
    this.db.users[email] = { uid: 'u_' + Date.now().toString(36), email, password, displayName: name.trim(), role: 'unknown', elderIds: [] };
    this.session.userEmail = email; this.save(); this.onChange();
  }
  async signOut() { this.session.userEmail = null; this.save(); this.onChange(); }
  async resetPassword() { /* sin correo real en modo local */ }
  approve(role) {
    const u = this.currentUser(); if (!u) return;
    u.role = role; u.elderIds = [ELDER_ID]; this.save(); this.onChange();
  }
  shifts() {
    const u = this.currentUser(); if (!u) return [];
    return u.role === 'caregiver' ? this.db.shifts.filter(s => s.caregiverUid === u.uid) : this.db.shifts;
  }
  cameras() { return this.db.cameras; }
  messages() { return this.db.conversation.messages; }
  unreadCount(uid) { return this.db.conversation.messages.filter(m => m.type !== 'system' && m.senderUid !== uid && !m.readBy.includes(uid)).length; }
  find(shiftId, taskId) {
    const shift = this.db.shifts.find(s => s.id === shiftId);
    return { shift, task: shift?.tasks.find(t => t.id === taskId) };
  }
  async toggleTask(shiftId, taskId) {
    const { shift, task } = this.find(shiftId, taskId);
    if (!task) throw new Error('La tarea ya no existe.');
    const next = task.status === 'done' ? 'pending' : 'done';
    if (next === 'done' && task.requiresPhoto && !task.photoUrl) throw new Error('Esta tarea requiere una foto como evidencia.');
    const delta = (next === 'done' ? 1 : 0) - (task.status === 'done' ? 1 : 0);
    task.status = next;
    task.completedAt = next === 'done' ? Date.now() : null;
    task.completedBy = next === 'done' ? this.currentUser().uid : null;
    shift.done = clamp(shift.done + delta, 0, shift.total);
    this.save(); this.onChange();
  }
  async saveNote(shiftId, taskId, note) { const { task } = this.find(shiftId, taskId); if (task) { task.note = note || null; this.save(); this.onChange(); } }
  async attachPhoto(shiftId, taskId) { const { task } = this.find(shiftId, taskId); if (task) { task.photoUrl = 'demo'; this.save(); this.onChange(); } }
  system(text) { this.db.conversation.messages.push({ id: 'm' + Date.now(), senderUid: 'system', senderName: 'Sistema', type: 'system', text, readBy: [], sentAt: Date.now() }); }
  async checkIn(shiftId) {
    const shift = this.db.shifts.find(s => s.id === shiftId); if (!shift) return;
    shift.status = 'in_progress'; shift.checkInAt = Date.now();
    this.system(`${this.currentUser().displayName} ha fichado la entrada a las ${fmtHm(shift.checkInAt)}`);
    this.save(); this.onChange();
  }
  async checkOut(shiftId) {
    const shift = this.db.shifts.find(s => s.id === shiftId); if (!shift) return;
    shift.status = 'completed'; shift.checkOutAt = Date.now();
    this.system(`${this.currentUser().displayName} ha fichado la salida a las ${fmtHm(shift.checkOutAt)}`);
    const pendingCritical = shift.tasks.filter(t => t.status === 'pending' && t.isCritical).map(t => t.title);
    if (pendingCritical.length) this.system(`Tareas importantes sin completar: ${pendingCritical.slice(0, 3).join(', ')}.`);
    else this.system(`Visita finalizada. Todas las tareas de hoy se han completado (${shift.done}/${shift.total}).`);
    this.save(); this.onChange();
  }
  async sendMessage(text) {
    const me = this.currentUser();
    this.db.conversation.messages.push({ id: 'm' + Date.now(), senderUid: me.uid, senderName: me.displayName, type: 'text', text, readBy: [me.uid], sentAt: Date.now() });
    this.save(); this.onChange();
  }
  async markAsRead() {
    const me = this.currentUser(); let changed = false;
    for (const m of this.db.conversation.messages) if (m.type !== 'system' && !m.readBy.includes(me.uid)) { m.readBy.push(me.uid); changed = true; }
    if (changed) { this.save(); this.onChange(); }
  }
}

/* =================================================== backend: Firebase */
class FirebaseBackend {
  constructor(config, onChange) {
    this.mode = 'firebase';
    this.config = config;
    this.onChange = onChange;
    this.loading = true;
    this.errors = {};
    this.authUser = null; this.profile = null;
    this.shiftsRaw = []; this.tasksByShift = {}; this.camerasRaw = []; this.messagesRaw = []; this.conversationDoc = null;
    this.profileSub = null; this.dataSubs = []; this.taskSubs = {}; this.dataKey = null;
  }
  async init() {
    const [app, auth, fs] = await Promise.all([
      import(FIREBASE_CDN + 'firebase-app.js'),
      import(FIREBASE_CDN + 'firebase-auth.js'),
      import(FIREBASE_CDN + 'firebase-firestore.js'),
    ]);
    this.A = auth; this.F = fs;
    this.app = app.initializeApp(this.config);
    this.auth = auth.getAuth(this.app);
    try {
      // Persistencia offline, como en la app Flutter.
      this.db = fs.initializeFirestore(this.app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) });
    } catch { this.db = fs.getFirestore(this.app); }
    auth.onAuthStateChanged(this.auth, user => this.onAuthUser(user));
  }
  onAuthUser(user) {
    if (this.profileSub) { this.profileSub(); this.profileSub = null; }
    this.clearData();
    this.authUser = user; this.profile = null; this.errors = {};
    if (!user) { this.loading = false; this.onChange(); return; }
    this.loading = true;
    const { doc, onSnapshot } = this.F;
    this.profileSub = onSnapshot(doc(this.db, 'users', user.uid), snap => {
      this.profile = snap.exists() ? snap.data() : null;
      this.loading = false;
      this.subscribeData();
      this.onChange();
    }, err => { this.errors.profile = err; this.profile = null; this.loading = false; this.onChange(); });
  }
  currentUser() {
    const u = this.authUser; if (!u) return null;
    const p = this.profile || {};
    return { uid: u.uid, email: u.email || '', displayName: p.displayName || u.displayName || (u.email || '').split('@')[0], role: p.role || 'unknown', elderIds: Array.isArray(p.elderIds) ? p.elderIds : [] };
  }
  clearData() {
    for (const off of this.dataSubs) off();
    for (const id of Object.keys(this.taskSubs)) this.taskSubs[id]();
    this.dataSubs = []; this.taskSubs = {}; this.dataKey = null;
    this.shiftsRaw = []; this.tasksByShift = {}; this.camerasRaw = []; this.messagesRaw = []; this.conversationDoc = null;
  }
  subscribeData() {
    const u = this.currentUser();
    if (!isProvisioned(u)) { this.clearData(); return; }
    const elderId = u.elderIds[0];
    const key = `${u.uid}|${u.role}|${elderId}|${todayStr()}`;
    if (this.dataKey === key) return;
    this.clearData(); this.dataKey = key;
    const { collection, doc, query, where, orderBy, limit, onSnapshot } = this.F;
    const fail = k => err => { console.warn('[cuidapp]', k, err); this.errors[k] = err; this.onChange(); };

    // Las reglas exigen `uid in memberUids`: la consulta debe llevarlo para que Firestore pueda autorizarla.
    const shiftsQ = u.role === 'caregiver'
      ? query(collection(this.db, 'shifts'), where('caregiverUid', '==', u.uid), where('date', '==', todayStr()), where('memberUids', 'array-contains', u.uid))
      : query(collection(this.db, 'shifts'), where('elderId', '==', elderId), where('date', '==', todayStr()), where('memberUids', 'array-contains', u.uid));
    this.dataSubs.push(onSnapshot(shiftsQ, snap => {
      delete this.errors.shifts;
      this.shiftsRaw = snap.docs.map(d => this.mapShift(d)).sort((a, b) => (a.scheduledStart ?? 0) - (b.scheduledStart ?? 0) || a.id.localeCompare(b.id));
      this.syncTaskSubs(); this.onChange();
    }, fail('shifts')));

    if (u.role !== 'caregiver') {
      this.dataSubs.push(onSnapshot(collection(this.db, 'elders', elderId, 'cameras'), snap => {
        delete this.errors.cameras;
        this.camerasRaw = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => String(a.label).localeCompare(String(b.label)));
        this.onChange();
      }, fail('cameras')));
    }

    const convRef = doc(this.db, 'conversations', 'conv_' + elderId);
    this.dataSubs.push(onSnapshot(convRef, snap => { this.conversationDoc = snap.exists() ? snap.data() : null; this.onChange(); }, fail('conversation')));
    this.dataSubs.push(onSnapshot(query(collection(convRef, 'messages'), orderBy('sentAt', 'desc'), limit(100)), snap => {
      delete this.errors.messages;
      this.messagesRaw = snap.docs.map(d => this.mapMessage(d)).sort((a, b) => a.sentAt - b.sentAt);
      this.onChange();
    }, fail('messages')));
  }
  syncTaskSubs() {
    const { collection, query, orderBy, onSnapshot } = this.F;
    const ids = new Set(this.shiftsRaw.map(s => s.id));
    for (const id of Object.keys(this.taskSubs)) if (!ids.has(id)) { this.taskSubs[id](); delete this.taskSubs[id]; delete this.tasksByShift[id]; }
    for (const id of ids) if (!this.taskSubs[id]) {
      this.taskSubs[id] = onSnapshot(query(collection(this.db, 'shifts', id, 'tasks'), orderBy('order')), snap => {
        this.tasksByShift[id] = snap.docs.map(d => this.mapTask(d)); this.onChange();
      }, err => { console.warn('[cuidapp] tasks', err); this.errors.tasks = err; this.onChange(); });
    }
  }
  ms(t) { return t == null ? null : (typeof t.toMillis === 'function' ? t.toMillis() : Number(t)); }
  mapShift(d) {
    const x = d.data({ serverTimestamps: 'estimate' });
    return { id: d.id, elderId: x.elderId, elderName: x.elderName || '', caregiverUid: x.caregiverUid, assignmentId: x.assignmentId || null, date: x.date,
      status: x.status || 'scheduled', total: x.taskSummary?.total ?? 0, done: x.taskSummary?.done ?? 0,
      scheduledStart: this.ms(x.scheduledStart), scheduledEnd: this.ms(x.scheduledEnd), checkInAt: this.ms(x.checkInAt), checkOutAt: this.ms(x.checkOutAt) };
  }
  mapTask(d) {
    const x = d.data({ serverTimestamps: 'estimate' });
    return { id: d.id, title: x.title || '', category: x.category || 'other', order: x.order ?? 0, status: x.status || 'pending',
      scheduledAt: this.ms(x.scheduledAt), completedAt: this.ms(x.completedAt), completedBy: x.completedBy || null,
      note: x.note || null, photoUrl: x.photoUrl || null, requiresPhoto: !!x.requiresPhoto, isCritical: !!x.isCritical };
  }
  mapMessage(d) {
    const x = d.data({ serverTimestamps: 'estimate' });
    return { id: d.id, senderUid: x.senderUid || '', senderName: x.senderName || '', type: x.type || 'text', text: x.text || '',
      readBy: Array.isArray(x.readBy) ? x.readBy : [], sentAt: this.ms(x.sentAt) ?? Date.now(), pending: d.metadata.hasPendingWrites };
  }
  authError(e) {
    const code = e && e.code || '';
    if (/invalid-credential|user-not-found|wrong-password|invalid-login-credentials|invalid-email/.test(code)) return 'Usuario o contraseña incorrectos.';
    if (/email-already-in-use/.test(code)) return 'Ya existe una cuenta con ese correo.';
    if (/weak-password/.test(code)) return 'La contraseña es demasiado débil.';
    if (/too-many-requests/.test(code)) return 'Demasiados intentos. Espera unos minutos.';
    if (/network-request-failed/.test(code)) return 'Sin conexión. Comprueba tu red.';
    if (/user-disabled/.test(code)) return 'Esta cuenta está desactivada.';
    if (/operation-not-allowed/.test(code)) return 'El acceso con correo y contraseña no está activado en el proyecto.';
    if (/api-key-not-valid|invalid-api-key|project-not-found/.test(code)) return 'La configuración de Firebase (firebase-config.js) no es válida.';
    return e && e.message ? e.message : 'Ha ocurrido un error.';
  }
  dbError(e, fallback) {
    const code = e && e.code || '';
    if (code === 'permission-denied') return 'No tienes permiso para hacer este cambio.';
    if (code === 'unavailable') return 'Sin conexión. Se guardará al recuperar la red.';
    if (code === 'aborted') return 'Conflicto al guardar. Inténtalo de nuevo.';
    return e && e.message && !code ? e.message : fallback;
  }
  async signIn(login, password) {
    try { await this.A.signInWithEmailAndPassword(this.auth, toEmail(login), password); }
    catch (e) { throw new Error(this.authError(e)); }
  }
  async register(name, login, password) {
    const { doc, setDoc, serverTimestamp } = this.F;
    let cred;
    try { cred = await this.A.createUserWithEmailAndPassword(this.auth, toEmail(login), password); }
    catch (e) { throw new Error(this.authError(e)); }
    try { await this.A.updateProfile(cred.user, { displayName: name.trim() }); } catch {}
    try {
      // El cliente nunca fija su rol: queda pendiente hasta que el backend lo aprueba.
      await setDoc(doc(this.db, 'users', cred.user.uid), {
        email: cred.user.email, displayName: name.trim(), elderIds: [], fcmTokens: [], locale: 'es',
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Madrid', createdAt: serverTimestamp(),
      });
    } catch (e) { console.warn('[cuidapp] perfil', e); }
  }
  async signOut() { await this.A.signOut(this.auth); }
  async resetPassword(login) { try { await this.A.sendPasswordResetEmail(this.auth, toEmail(login)); } catch (e) { throw new Error(this.authError(e)); } }
  shifts() { return this.shiftsRaw.map(s => ({ ...s, tasks: this.tasksByShift[s.id] || [] })); }
  cameras() { return this.camerasRaw; }
  messages() { return this.messagesRaw; }
  unreadCount(uid) { return this.messagesRaw.filter(m => m.type !== 'system' && m.senderUid !== uid && !m.readBy.includes(uid)).length; }
  async toggleTask(shiftId, taskId) {
    const { doc, runTransaction, serverTimestamp } = this.F;
    const uid = this.currentUser().uid;
    try {
      await runTransaction(this.db, async tx => {
        const taskRef = doc(this.db, 'shifts', shiftId, 'tasks', taskId), shiftRef = doc(this.db, 'shifts', shiftId);
        const [taskSnap, shiftSnap] = await Promise.all([tx.get(taskRef), tx.get(shiftRef)]);
        if (!taskSnap.exists()) throw new Error('La tarea ya no existe.');
        if (!shiftSnap.exists()) throw new Error('El turno ya no existe.');
        const t = taskSnap.data(); const previous = t.status || 'pending';
        const status = previous === 'done' ? 'pending' : 'done';
        if (status === 'done' && t.requiresPhoto && !t.photoUrl) throw new Error('Esta tarea requiere una foto como evidencia.');
        const summary = shiftSnap.data().taskSummary || {}; const total = summary.total ?? 0, done = summary.done ?? 0;
        const delta = (status === 'done' ? 1 : 0) - (previous === 'done' ? 1 : 0);
        tx.update(taskRef, { status, completedAt: status === 'done' ? serverTimestamp() : null, completedBy: status === 'done' ? uid : null, updatedAt: serverTimestamp() });
        tx.update(shiftRef, { taskSummary: { total, done: clamp(done + delta, 0, total) }, updatedAt: serverTimestamp() });
      });
    } catch (e) { throw new Error(this.dbError(e, 'No se ha podido guardar el cambio.')); }
  }
  async saveNote(shiftId, taskId, note) {
    const { doc, updateDoc, serverTimestamp } = this.F;
    try { await updateDoc(doc(this.db, 'shifts', shiftId, 'tasks', taskId), { note: note || null, updatedAt: serverTimestamp() }); }
    catch (e) { throw new Error(this.dbError(e, 'No se ha podido guardar la nota.')); }
  }
  async attachPhoto(shiftId, taskId) {
    const { doc, updateDoc, serverTimestamp } = this.F;
    try { await updateDoc(doc(this.db, 'shifts', shiftId, 'tasks', taskId), { photoUrl: 'simulada://' + taskId, updatedAt: serverTimestamp() }); }
    catch (e) { throw new Error(this.dbError(e, 'No se ha podido adjuntar la foto.')); }
  }
  async checkIn(shiftId) {
    const { doc, updateDoc, serverTimestamp } = this.F;
    try { await updateDoc(doc(this.db, 'shifts', shiftId), { status: 'in_progress', checkInAt: serverTimestamp(), updatedAt: serverTimestamp() }); }
    catch (e) { throw new Error(this.dbError(e, 'No se ha podido fichar.')); }
  }
  async checkOut(shiftId) {
    const { doc, updateDoc, serverTimestamp } = this.F;
    try { await updateDoc(doc(this.db, 'shifts', shiftId), { status: 'completed', checkOutAt: serverTimestamp(), updatedAt: serverTimestamp() }); }
    catch (e) { throw new Error(this.dbError(e, 'No se ha podido fichar.')); }
  }
  async sendMessage(text) {
    const { collection, addDoc, serverTimestamp } = this.F;
    const me = this.currentUser();
    try {
      await addDoc(collection(this.db, 'conversations', 'conv_' + me.elderIds[0], 'messages'), {
        senderUid: me.uid, senderName: me.displayName, type: 'text', text, readBy: [me.uid], sentAt: serverTimestamp(),
      });
    } catch (e) { throw new Error(this.dbError(e, 'No se ha podido enviar el mensaje.')); }
  }
  async markAsRead() {
    const { doc, writeBatch, arrayUnion, serverTimestamp } = this.F;
    const me = this.currentUser(); if (!isProvisioned(me)) return;
    const convId = 'conv_' + me.elderIds[0];
    const unread = this.messagesRaw.filter(m => m.type !== 'system' && !m.pending && !m.readBy.includes(me.uid));
    const conv = this.conversationDoc;
    const hasCounter = conv && conv.unread && conv.unread[me.uid];
    if (!unread.length && !hasCounter) return;
    try {
      const batch = writeBatch(this.db);
      for (const m of unread.slice(0, 200)) batch.update(doc(this.db, 'conversations', convId, 'messages', m.id), { readBy: arrayUnion(me.uid) });
      if (hasCounter) batch.update(doc(this.db, 'conversations', convId), { [`unread.${me.uid}`]: 0, updatedAt: serverTimestamp() });
      await batch.commit();
    } catch (e) { console.warn('[cuidapp] markAsRead', e); }
  }
}

/* ================================================================ router */
const R = { splash: '/', login: '/login', register: '/register', pending: '/pending',
  family: '/family', cameras: '/family/cameras', familyChat: '/family/chat',
  caregiver: '/caregiver', caregiverChat: '/caregiver/chat' };
let stack = [R.splash];
let lastLoc = null;
const current = () => stack[stack.length - 1];

function homeFor(user) {
  if (!user) return R.login;
  if (user.role === 'family' || user.role === 'admin') return R.family;
  if (user.role === 'caregiver') return R.caregiver;
  return R.pending;
}
/** Copia del `redirect` de app_router.dart */
function guard(location) {
  if (backend.loading) return location === R.splash ? null : R.splash;
  const user = backend.currentUser();
  const onAuth = location === R.login || location === R.register || location === R.splash;
  if (!user) return (onAuth && location !== R.splash) ? null : R.login;
  if (!isProvisioned(user)) return location === R.pending ? null : R.pending;
  const home = homeFor(user);
  if (onAuth || location === R.pending) return home;
  if (location.startsWith(R.family) && !(user.role === 'family' || user.role === 'admin')) return home;
  if (location.startsWith(R.caregiver) && user.role !== 'caregiver') return home;
  return null;
}
function go(location, { push = false } = {}) {
  if (push) stack.push(location); else stack = [location];
  render();
}
function pop() { if (stack.length > 1) stack.pop(); render(); }
