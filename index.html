function chatScreen() {
  const me = backend.currentUser();
  const msgs = backend.messages();
  let list;
  if (backend.errors.messages) {
    list = `<div class="body center"><p class="body-m center" style="padding:32px">No se han podido cargar los mensajes.<br>${esc(errorText(backend.errors.messages))}</p></div>`;
  } else if (!msgs.length) {
    list = `<div class="body center"><div class="empty">${icon('forum')}<div class="title-m">Todavía no hay mensajes</div><p class="body-s">Escribe instrucciones, recordatorios o preguntas. La otra persona recibirá una notificación.</p></div></div>`;
  } else {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const dayLabel = ms => {
      const d = new Date(ms); d.setHours(0, 0, 0, 0);
      const diff = Math.round((today - d) / 86400000);
      if (diff === 0) return 'Hoy'; if (diff === 1) return 'Ayer';
      const x = new Date(ms); return `${x.getDate()} de ${MONTHS[x.getMonth()]}`;
    };
    let html = '', prev = null;
    for (const m of msgs) {
      const newDay = !prev || new Date(prev.sentAt).toDateString() !== new Date(m.sentAt).toDateString();
      if (newDay) html += `<div class="day-sep"><span>${dayLabel(m.sentAt)}</span></div>`;
      if (m.type === 'system') { html += `<div class="sys-msg">${esc(m.text)}</div>`; prev = m; continue; }
      const mine = m.senderUid === me.uid;
      const showSender = !prev || prev.senderUid !== m.senderUid;
      const readByOther = m.readBy.length > 1;
      const tick = m.pending ? icon('schedule') : icon(readByOther ? 'done_all' : 'done', { cls: readByOther ? 'read' : '' });
      html += `<div class="bubble-row${mine ? ' mine' : ''}"><div class="bubble">
        ${showSender && !mine ? `<div class="sender">${esc(m.senderName)}</div>` : ''}${esc(m.text)}
        <div class="meta"><span class="time">${m.pending ? 'Enviando…' : fmtHm(m.sentAt)}</span>${mine ? tick : ''}</div>
      </div></div>`;
      prev = m;
    }
    list = `<div class="body" id="chatBody"><div class="chat-list">${html}</div></div>`;
  }
  return appBar({ title: 'Mensajes', back: true }) + list +
    `<div class="composer"><div class="tbox"><textarea id="draft" rows="1" maxlength="1000" placeholder="Escribe un mensaje…">${esc(ui.chat.draft)}</textarea></div>
     <button class="btn icon-filled" data-act="send" title="Enviar">${icon('send')}</button></div>`;
}

function caregiverHome() {
  const user = backend.currentUser();
  const shifts = backend.shifts();
  const unread = backend.unreadCount(user.uid);
  const now = Date.now();
  const bar = appBar({ title: 'Mi jornada', actions:
    `<button class="iconbtn" data-act="open-chat" title="Mensajes">${icon('forum')}${unread > 0 ? `<span class="badge">${unread > 99 ? '99+' : unread}</span>` : ''}</button>
     <button class="iconbtn" data-act="signout" title="Cerrar sesión">${icon('logout')}</button>` });

  if (backend.errors.shifts) {
    return bar + `<div class="body center"><div class="empty">${icon('cloud_off', { cls: 'err' })}<div class="title-m">No hemos podido cargar tu jornada</div><p class="body-s">${esc(errorText(backend.errors.shifts))}</p></div></div>`;
  }
  let shift = ui.selectedShiftId ? shifts.find(s => s.id === ui.selectedShiftId) : null;
  shift ??= pickActiveShift(shifts, now);
  if (!shift) {
    return bar + `<div class="body center"><div class="empty">${icon('event_available')}<div class="title-m">Hoy no tienes ningún turno asignado</div><p class="body-s">Si crees que es un error, escribe a coordinación desde el chat.</p></div></div>`;
  }

  const canEdit = shift.checkInAt != null && shift.status !== 'completed';
  const selector = shifts.length > 1 ? `<div class="seg">${shifts.map(s =>
    `<button class="${s.id === shift.id ? 'on' : ''}" data-act="select-shift" data-arg="${esc(s.id)}">${s.status === 'completed' ? icon('check') : ''}${s.scheduledStart ? fmtHm(s.scheduledStart) : 'Visita'}</button>`).join('')}</div>` : '';

  let action;
  if (shift.checkInAt == null) action = `<button class="btn filled block h48" data-act="checkin">${icon('login')}Fichar entrada</button>`;
  else if (shift.status !== 'completed') action = `<button class="btn outlined block h48" data-act="checkout">${icon('logout')}Fichar salida</button>`;
  else action = `<div class="row gap8">${icon('check_circle', { color: 'var(--primary)' })}<span class="body-m">Jornada cerrada</span></div>`;

  const schedule = (shift.scheduledStart && shift.scheduledEnd) ? `${fmtHm(shift.scheduledStart)} – ${fmtHm(shift.scheduledEnd)}` : 'Horario sin definir';
  const header = `<div class="card" style="margin:12px 12px 4px"><div class="col" style="padding:16px">
    <div class="row gap12">
      <span class="avatar">${icon('elderly')}</span>
      <div class="col spacer" style="min-width:0"><span class="title-m">${esc(shift.elderName)}</span><span class="body-s muted">${schedule}</span></div>
      <span class="title-l bold primary">${shift.done}/${shift.total}</span>
    </div>
    <div style="height:12px"></div>${progressBar(shift.total ? shift.done / shift.total : 0, true)}<div style="height:16px"></div>${action}
  </div></div>`;

  const grouped = new Map();
  for (const t of [...shift.tasks].sort((a, b) => a.order - b.order)) {
    if (!grouped.has(t.category)) grouped.set(t.category, []);
    grouped.get(t.category).push(t);
  }
  let groups = '';
  for (const [cat, tasks] of grouped) {
    const c = CATEGORY[cat] || CATEGORY.other;
    groups += `<div class="cat-header" style="color:${c.color}">${icon(c.icon)}<span>${c.label}</span><span class="count">${tasks.filter(t => t.status === 'done').length}/${tasks.length}</span></div>`;
    groups += tasks.map(t => taskTile(shift, t, canEdit, now)).join('');
  }
  if (!shift.tasks.length && backend.mode === 'firebase' && !backend.tasksByShift[shift.id]) groups = `<div class="body center" style="padding:24px;display:flex;justify-content:center"><div class="spinner"></div></div>`;
  return bar + `<div class="body">${selector}${header}${groups}<div style="height:96px"></div></div>`;
}

function taskTile(shift, t, enabled, now) {
  const c = CATEGORY[t.category] || CATEGORY.other;
  const overdue = isOverdue(t, now);
  const skipped = t.status === 'skipped';
  const resolved = t.status !== 'pending';
  const chips = [];
  const chip = (ic, label, color) => `<span class="chip" style="color:${color}">${icon(ic)}${label}</span>`;
  if (t.scheduledAt != null) chips.push(chip('schedule', fmtHm(t.scheduledAt), overdue ? 'var(--error)' : 'var(--outline)'));
  if (overdue) chips.push(chip('warning', 'Fuera de hora', 'var(--error)'));
  if (skipped) chips.push(chip('block', 'No realizada', 'var(--error)'));
  if (t.requiresPhoto && !t.photoUrl) chips.push(chip('photo_camera', 'Requiere foto', 'var(--tertiary)'));
  const hasNote = !!(t.note && t.note.length);
  const canToggle = enabled && !skipped;
  const arg = `${shift.id}|${t.id}`;
  return `<div class="task${enabled ? '' : ' disabled'}">
    <span class="cbwrap${canToggle ? '' : ' off'}" ${canToggle ? `data-act="toggle-task" data-arg="${esc(arg)}"` : ''}><span class="cb${t.status === 'done' ? ' on' : ''}">${t.status === 'done' ? icon('check') : ''}</span></span>
    <div class="content">
      <div class="title${resolved ? ' resolved' : ''}${t.isCritical ? ' critical' : ''}">${esc(t.title)}</div>
      ${chips.length ? `<div class="chips">${chips.join('')}</div>` : ''}
      ${hasNote ? `<div class="note">${esc(t.note)}</div>` : ''}
    </div>
    <div class="secondary">${icon(c.icon, { size: 22, color: c.color, cls: 'cat' })}
      <button class="iconbtn" title="Añadir nota" ${enabled ? `data-act="open-note" data-arg="${esc(arg)}"` : 'disabled'}>${icon('sticky_note_2', { fill: hasNote ? 1 : 0, color: hasNote ? 'var(--primary)' : 'var(--outline)' })}</button>
    </div>
  </div>`;
}

/* ================================================================ render */
let renderQueued = false;
function requestRender() { if (renderQueued) return; renderQueued = true; queueMicrotask(() => { renderQueued = false; render(); }); }

function render() {
  const redirect = guard(current());
  if (redirect) stack = [redirect];
  const loc = current();
  const app = $('#app');
  const prevBody = $('.body', app);
  const keepScroll = prevBody && lastLoc === loc ? prevBody.scrollTop : 0;
  const activeId = document.activeElement && app.contains(document.activeElement) ? document.activeElement.id : null;
  const selection = activeId && document.activeElement.selectionStart != null ? [document.activeElement.selectionStart, document.activeElement.selectionEnd] : null;
  stopCamera();

  let html;
  if (loc === R.splash) html = splashScreen();
  else if (loc === R.login || loc === R.register) html = loginScreen();
  else if (loc === R.pending) html = pendingScreen();
  else if (loc === R.family) html = familyHome();
  else if (loc === R.cameras) html = cameraList();
  else if (loc.startsWith(R.cameras + '/')) html = cameraLive(loc.slice(R.cameras.length + 1));
  else if (loc === R.familyChat || loc === R.caregiverChat) html = chatScreen();
  else if (loc === R.caregiver) html = caregiverHome();
  else html = `<div class="body center"><p class="body-m">Ruta no encontrada: ${esc(loc)}</p></div>`;

  const black = loc.startsWith(R.cameras + '/');
  app.innerHTML = `<div class="route${lastLoc !== loc ? ' anim' : ''}${black ? ' black' : ''}">${html}</div>`;

  const body = $('.body', app), bar = $('[data-appbar]', app);
  if (body) {
    body.scrollTop = keepScroll;
    if (bar) { const sync = () => bar.classList.toggle('scrolled', body.scrollTop > 0); sync(); body.addEventListener('scroll', sync, { passive: true }); }
  }
  if (loc === R.familyChat || loc === R.caregiverChat) afterChatRender(lastLoc !== loc);
  if (black) startCamera();
  if ((loc === R.login || loc === R.register) && lastLoc !== loc) { const first = $('input', app); if (first && !ui.login.loading) setTimeout(() => first.focus(), 60); }
  if (activeId && lastLoc === loc) { const el = document.getElementById(activeId); if (el) { el.focus(); if (selection && el.setSelectionRange) try { el.setSelectionRange(selection[0], selection[1]); } catch {} } }
  lastLoc = loc;
  updateDemoPanel();
}

/* ------------------------------------------------------------- chat glue */
function afterChatRender(fresh) {
  backend.markAsRead();
  const body = $('#chatBody'); if (body) body.scrollTop = body.scrollHeight;
  const ta = $('#draft');
  if (ta) {
    const box = ta.parentElement;
    const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 144) + 'px'; };
    grow();
    ta.addEventListener('input', () => { ui.chat.draft = ta.value; grow(); });
    ta.addEventListener('focus', () => box.classList.add('focus'));
    ta.addEventListener('blur', () => box.classList.remove('focus'));
    ta.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.keyCode === 13) && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
    if (fresh) setTimeout(() => ta.focus(), 80);
  }
}
async function sendMessage() {
  const text = ui.chat.draft.trim();
  if (!text) return;
  ui.chat.draft = '';
  const ta = $('#draft'); if (ta) { ta.value = ''; ta.style.height = 'auto'; }
  try { await backend.sendMessage(text); } catch (e) { ui.chat.draft = text; snack(e.message); render(); }
}

/* ----------------------------------------------------------- camera glue */
function startCamera() {
  const st = ui.camera;
  if (!st.ready && !st.error && !st.timer) {
    st.timer = setTimeout(() => { st.timer = null; st.ready = true; render(); }, 1400 + Math.random() * 600);
    return;
  }
  const canvas = $('#cam'); if (!canvas) return;
  const camId = current().slice(R.cameras.length + 1);
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const t0 = performance.now();
  const draw = now => {
    const t = (now - t0) / 1000;
    drawScene(ctx, W, H, camId, t);
    const ts = $('#camTs'); if (ts) { const d = new Date(); ts.textContent = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
    st.raf = requestAnimationFrame(draw);
  };
  st.raf = requestAnimationFrame(draw);
}
function stopCamera() {
  const st = ui.camera;
  if (st.raf) cancelAnimationFrame(st.raf);
  if (st.timer) clearTimeout(st.timer);
  st.raf = null; st.timer = null;
  if (!current().startsWith(R.cameras + '/')) { st.ready = false; st.error = null; st.muted = true; }
}
function drawScene(ctx, W, H, camId, t) {
  const flicker = 1 + Math.sin(t * 7.3) * 0.012 + Math.sin(t * 1.7) * 0.01;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#4a5a52'); g.addColorStop(1, '#232a26');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  if (camId === 'cam_pasillo') {
    ctx.fillStyle = '#3a3129'; ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(W * .36, H * .58); ctx.lineTo(W * .64, H * .58); ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5b6a62'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W * .36, H * .22); ctx.lineTo(W * .36, H * .58); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#4d5b54'; ctx.beginPath(); ctx.moveTo(W, 0); ctx.lineTo(W * .64, H * .22); ctx.lineTo(W * .64, H * .58); ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2a3330'; ctx.fillRect(W * .36, H * .22, W * .28, H * .36);
    ctx.fillStyle = `rgba(255,232,190,${0.75 * flicker})`; ctx.fillRect(W * .44, H * .28, W * .12, H * .30);
    ctx.strokeStyle = '#1b1f1d'; ctx.lineWidth = 3; ctx.strokeRect(W * .44, H * .28, W * .12, H * .30);
    for (let i = 0; i < 3; i++) { const x = W * (.08 + i * .09), y = H * (.12 + i * .03); ctx.fillStyle = '#2d2a26'; ctx.fillRect(x, y, W * .05, H * .07); ctx.fillStyle = '#8b96a3'; ctx.fillRect(x + 3, y + 3, W * .05 - 6, H * .07 - 6); }
    ctx.fillStyle = '#6a5a4b'; ctx.fillRect(W * .74, H * .48, W * .12, H * .05);
    ctx.fillStyle = '#4a3f35'; ctx.fillRect(W * .75, H * .53, W * .01, H * .2); ctx.fillRect(W * .845, H * .53, W * .01, H * .2);
  } else {
    ctx.fillStyle = '#2a2521'; ctx.fillRect(0, H * .64, W, H * .36);
    ctx.fillStyle = '#5a4c42'; ctx.fillRect(W * .06, H * .70, W * .5, H * .22);
    ctx.fillStyle = `rgba(150,178,205,${flicker})`; ctx.fillRect(W * .64, H * .12, W * .26, H * .36);
    ctx.strokeStyle = '#e6dfd3'; ctx.lineWidth = 5; ctx.strokeRect(W * .64, H * .12, W * .26, H * .36);
    ctx.beginPath(); ctx.moveTo(W * .77, H * .12); ctx.lineTo(W * .77, H * .48); ctx.moveTo(W * .64, H * .30); ctx.lineTo(W * .90, H * .30); ctx.stroke();
    ctx.fillStyle = '#d9d0c4'; ctx.fillRect(W * .61, H * .10, W * .03, H * .42); ctx.fillRect(W * .90, H * .10, W * .03, H * .42);
    ctx.fillStyle = '#6b5647'; roundRect(ctx, W * .12, H * .44, W * .40, H * .12, 10); ctx.fill();
    ctx.fillStyle = '#7a6454'; roundRect(ctx, W * .10, H * .54, W * .44, H * .14, 10); ctx.fill();
    ctx.fillStyle = '#8c7462'; roundRect(ctx, W * .15, H * .46, W * .14, H * .09, 6); ctx.fill(); roundRect(ctx, W * .33, H * .46, W * .14, H * .09, 6); ctx.fill();
    ctx.fillStyle = '#3d3a36'; ctx.fillRect(W * .58, H * .55, W * .09, H * .02); ctx.fillRect(W * .62, H * .57, W * .01, H * .12);
    ctx.fillStyle = `rgba(255,214,150,${0.9 * flicker})`; ctx.beginPath(); ctx.moveTo(W * .90, H * .56); ctx.lineTo(W * .96, H * .56); ctx.lineTo(W * .98, H * .66); ctx.lineTo(W * .88, H * .66); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#3a3532'; ctx.fillRect(W * .928, H * .66, W * .006, H * .2);
    const glow = ctx.createRadialGradient(W * .93, H * .62, 5, W * .93, H * .62, W * .22); glow.addColorStop(0, `rgba(255,200,120,${0.28 * flicker})`); glow.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#2e2a27'; ctx.fillRect(W * .18, H * .16, W * .12, H * .16); ctx.fillStyle = '#7f8f9c'; ctx.fillRect(W * .19, H * .17, W * .10, H * .14);
  }
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .95);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.06)';
  for (let i = 0; i < 90; i++) ctx.fillRect(Math.random() * W, Math.random() * H, 2, 1);
  const band = ((t * 40) % (H + 60)) - 30; ctx.fillStyle = 'rgba(255,255,255,.025)'; ctx.fillRect(0, band, W, 18);
}
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

/* ----------------------------------------------------------- nota (sheet) */
function openNoteSheet(shiftId, taskId) {
  const findTask = () => backend.shifts().find(s => s.id === shiftId)?.tasks.find(t => t.id === taskId);
  const task = findTask();
  if (!task) return;
  const scrim = $('#scrim');
  let draft = task.note || '';
  const renderSheet = () => {
    const t = findTask() || task;
    scrim.innerHTML = `<div class="sheet col" data-sheet>
      <div class="title-m">${esc(t.title)}</div>
      <div style="height:4px"></div>
      <p class="body-s">Lo que escribas aquí lo ve la familia al instante.</p>
      <div style="height:16px"></div>
      <textarea id="noteText" maxlength="500" placeholder="Ej.: hoy ha comido poco, se ha quejado de la rodilla…">${esc(draft)}</textarea>
      <div class="counter"><span id="noteCount">${draft.length}</span>/500</div>
      ${t.requiresPhoto ? `<div style="height:8px"></div><button class="btn outlined block" data-act="attach-photo" ${t.photoUrl ? 'disabled' : ''}>${icon(t.photoUrl ? 'check_circle' : 'photo_camera')}${t.photoUrl ? 'Foto adjuntada' : 'Adjuntar foto (simulada)'}</button>` : ''}
      <div style="height:8px"></div>
      <button class="btn filled block" data-act="save-note">Guardar nota</button>
    </div>`;
    const ta = $('#noteText'); ta.addEventListener('input', () => { draft = ta.value; $('#noteCount').textContent = ta.value.length; });
    setTimeout(() => ta.focus(), 50);
  };
  renderSheet();
  scrim.classList.add('show');
  scrim.onclick = async e => {
    const btn = e.target.closest('[data-act]');
    if (btn) {
      if (btn.dataset.act === 'attach-photo') {
        try { await backend.attachPhoto(shiftId, taskId); snack('Foto adjuntada como evidencia.'); } catch (err) { snack(err.message); }
        renderSheet(); return;
      }
      if (btn.dataset.act === 'save-note') {
        const note = $('#noteText').value.trim();
        closeSheet();
        try { await backend.saveNote(shiftId, taskId, note); } catch (err) { snack(err.message); }
        return;
      }
    }
    if (!e.target.closest('[data-sheet]')) closeSheet();
  };
}
function closeSheet() { const s = $('#scrim'); s.classList.remove('show'); s.innerHTML = ''; s.onclick = null; }

/* ============================================================== acciones */
function activeShift() {
  const shifts = backend.shifts();
  return (ui.selectedShiftId && shifts.find(s => s.id === ui.selectedShiftId)) || pickActiveShift(shifts, Date.now());
}
async function run(fn) { try { await fn(); } catch (e) { snack(e.message || 'No se ha podido guardar.'); } }

async function submitLogin() {
  const u = ui.login;
  u.errors = {};
  if (u.isRegister && u.name.trim().length < 3) u.errors.name = 'Introduce tu nombre completo';
  const le = loginError(u.email); if (le) u.errors.email = le;
  if (u.password.length < 6) u.errors.password = 'Mínimo 6 caracteres';
  if (Object.keys(u.errors).length) { render(); return; }

  u.loading = true; render();
  try {
    if (u.isRegister) await backend.register(u.name, u.email, u.password);
    else await backend.signIn(u.email, u.password);
    u.password = ''; u.errors = {};
  } catch (e) {
    snack(e.message || 'Ha ocurrido un error.');
  } finally {
    u.loading = false; render();
  }
}

/* =============================================================== eventos */
$('#app').addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act, arg = el.dataset.arg;
  switch (act) {
    case 'back': pop(); break;
    case 'signout': ui.selectedShiftId = null; run(() => backend.signOut()); break;
    case 'toggle-obscure': ui.login.obscure = !ui.login.obscure; syncLoginInputs(); render(); break;
    case 'toggle-register': syncLoginInputs(); ui.login.isRegister = !ui.login.isRegister; ui.login.errors = {}; stack = [ui.login.isRegister ? R.register : R.login]; render(); break;
    case 'forgot': {
      syncLoginInputs();
      if (!ui.login.email.trim()) { snack('Escribe tu correo para enviarte el enlace.'); break; }
      run(async () => { await backend.resetPassword(ui.login.email); snack('Si el correo existe, recibirás un enlace.'); });
      break;
    }
    case 'open-cameras': go(R.cameras, { push: true }); break;
    case 'open-camera': go(R.cameras + '/' + arg, { push: true }); break;
    case 'open-chat': go(backend.currentUser().role === 'caregiver' ? R.caregiverChat : R.familyChat, { push: true }); break;
    case 'open-plan': snack('Editor del plan de cuidados: pendiente en la app.'); break;
    case 'camera-mute': ui.camera.muted = !ui.camera.muted; render(); break;
    case 'camera-retry': ui.camera.error = null; ui.camera.ready = false; render(); break;
    case 'send': sendMessage(); break;
    case 'select-shift': ui.selectedShiftId = arg; render(); break;
    case 'checkin': { const s = activeShift(); if (s) run(() => backend.checkIn(s.id)); break; }
    case 'checkout': { const s = activeShift(); if (s) run(() => backend.checkOut(s.id)); break; }
    case 'toggle-task': { const [sid, tid] = arg.split('|'); run(() => backend.toggleTask(sid, tid)); break; }
    case 'open-note': { const [sid, tid] = arg.split('|'); openNoteSheet(sid, tid); break; }
  }
});
$('#app').addEventListener('submit', e => {
  if (e.target.dataset.form !== 'login') return;
  e.preventDefault();
  if (ui.login.loading) return;
  syncLoginInputs();
  submitLogin();
});
function syncLoginInputs() {
  for (const inp of $$('form[data-form="login"] input')) ui.login[inp.name] = inp.value;
}
$('#app').addEventListener('keydown', e => {
  if (!(e.key === 'Enter' || e.keyCode === 13) || e.target.tagName !== 'INPUT') return;
  const form = e.target.closest('form[data-form="login"]'); if (!form) return;
  e.preventDefault(); form.requestSubmit();
});
$('#app').addEventListener('focusin', e => { const f = e.target.closest('.field'); if (f && e.target.tagName === 'INPUT') f.classList.add('focus'); });
$('#app').addEventListener('focusout', e => { const f = e.target.closest('.field'); if (f && e.target.tagName === 'INPUT') { f.classList.remove('focus'); f.classList.toggle('float', !!e.target.value); } });
$('#app').addEventListener('input', e => {
  const f = e.target.closest('.field'); if (!f) return;
  f.classList.toggle('float', !!e.target.value);
  if (e.target.name) ui.login[e.target.name] = e.target.value;
  if (e.target.name === 'email') {
    const hintEl = f.querySelector('.hint'); const v = e.target.value.trim();
    const text = v && !v.includes('@') ? `Se usará ${toEmail(v)}` : '';
    if (hintEl) { hintEl.textContent = text; hintEl.hidden = !text; }
    else if (text && !f.querySelector('.helper')) { const d = document.createElement('div'); d.className = 'hint'; d.textContent = text; f.appendChild(d); }
  }
});

/* ---------------------------------------------------------- panel demo */
function applyTheme() {
  const dark = ui.dark ?? window.matchMedia('(prefers-color-scheme: dark)').matches;
  $('#phoneInner').dataset.theme = dark ? 'dark' : 'light';
  $('#darkIcon').textContent = dark ? 'light_mode' : 'dark_mode';
  $('#darkLabel').textContent = dark ? 'Modo claro' : 'Modo oscuro';
}
function updateDemoPanel() {
  const fb = backend.mode === 'firebase';
  const chip = $('#modeChip');
  chip.className = 'mode ' + (fb ? 'firebase' : 'local');
  chip.innerHTML = fb ? `${icon('cloud_done')} Conectado a Firebase · ${esc(backend.config.projectId || '')}` : `${icon('storage')} Demo local (sin base de datos)`;
  $('#modeText').textContent = fb
    ? 'Los datos viven en Firestore y Firebase Auth, con las mismas reglas de seguridad que la app móvil. Lo que hagas aquí lo verá cualquier otro navegador al instante.'
    : (window.CUIDAPP_INIT_ERROR ? `No se pudo conectar con Firebase (${window.CUIDAPP_INIT_ERROR}). Los datos viven solo en este navegador y se regeneran cada día.` : 'Los datos viven solo en este navegador y se regeneran cada día, como hace la función nocturna de turnos de la app real.');

  const accounts = fb
    ? [['Familiar', 'test', 'cuidapp123'], ['Cuidadora', 'ana', 'cuidapp123']]
    : [['Familiar', 'test', 'cuidapp123'], ['Familiar', 'lucia@example.com', 'test1234'], ['Cuidadora', 'ana@example.com', 'test1234']];
  $('#accountsTable').innerHTML = accounts.map(([r, u, p]) => `<tr><td>${r}</td><td><code>${esc(u)}</code> · <code>${esc(p)}</code></td></tr>`).join('');
  $('#loginButtons').innerHTML = accounts.filter((a, i) => fb || i !== 1).map(([r, u, p]) =>
    `<button class="accent" data-demo="login" data-user="${esc(u)}" data-pass="${esc(p)}">${icon(r === 'Familiar' ? 'family_restroom' : 'medical_services')}Entrar como ${esc(u.split('@')[0])}</button>`).join('');

  $('#resetBtn').hidden = fb;
  const u = backend.currentUser();
  const pending = !!(u && !isProvisioned(u));
  $('#pendingTools').hidden = !pending;
  if (pending) {
    $('#pendingText').textContent = fb
      ? 'Esta cuenta está pendiente de aprobación. En Firebase la activa el backend (función provisionUser o el script de siembra); el cliente no puede asignarse un rol.'
      : 'Esta cuenta está pendiente de aprobación. En producción la activa la función provisionUser; aquí puedes simularlo:';
    $('#pendingActions').hidden = fb;
  }
  const roleName = { family: 'familiar', caregiver: 'cuidadora', admin: 'admin', unknown: 'pendiente' };
  $('#demoStatus').innerHTML = u
    ? `Sesión: <b>${esc(u.displayName)}</b> (${roleName[u.role] || esc(u.role)}) · pantalla <b>${esc(current())}</b>`
    : `Sin sesión · pantalla <b>${esc(current())}</b>`;
  $('#hintText').textContent = `Puedes entrar con un usuario corto: "test" equivale a test@${USERNAME_DOMAIN}. Marca tareas o ficha como cuidadora y vuelve a entrar como familiar: el panel refleja el mismo estado.`;
}
document.querySelector('.demo-panel').addEventListener('click', e => {
  const btn = e.target.closest('[data-demo]'); if (!btn) return;
  switch (btn.dataset.demo) {
    case 'login': {
      ui.login.loading = false; ui.login.errors = {}; ui.login.password = ''; ui.login.email = ''; ui.selectedShiftId = null;
      run(async () => { if (backend.currentUser()) await backend.signOut(); await backend.signIn(btn.dataset.user, btn.dataset.pass); });
      break;
    }
    case 'dark': ui.dark = !(ui.dark ?? window.matchMedia('(prefers-color-scheme: dark)').matches); try { localStorage.setItem('cuidapp_ui_dark', JSON.stringify(ui.dark)); } catch {} applyTheme(); break;
    case 'reset': if (backend.mode === 'local') { ui.selectedShiftId = null; backend.reset(); snack('Datos de la demo regenerados.'); } break;
    case 'approve-family': case 'approve-caregiver':
      if (backend.mode === 'local') backend.approve(btn.dataset.demo === 'approve-family' ? 'family' : 'caregiver');
      break;
  }
});

/* ================================================================= boot */
function tickClock() { const d = new Date(); $('#clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
let backend;
async function boot() {
  applyTheme();
  tickClock(); setInterval(tickClock, 15000);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  if (FIREBASE_CONFIG) {
    backend = new FirebaseBackend(FIREBASE_CONFIG, requestRender);
    render();
    try { await backend.init(); return; }
    catch (e) {
      console.error('[cuidapp] Firebase no disponible, usando demo local', e);
      window.CUIDAPP_INIT_ERROR = e && e.message ? e.message : String(e);
    }
  }
  backend = new LocalBackend(requestRender);
  render();
  await backend.init();
}
boot();
})();
</script>
</body>
</html>
