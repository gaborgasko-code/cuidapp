# Publica la web en GitHub Pages en cada push a main.
#
# `configure-pages` con `enablement: true` activa Pages en el repositorio si aún
# no lo está, y el paso siguiente fija el dominio personalizado con el token del
# propio workflow. Así no hace falta tocar Settings → Pages a mano.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Activar Pages si hace falta
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Fijar el dominio personalizado
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/pages" -f cname="$(cat CNAME)"

      - name: Preparar el artefacto
        run: rm -rf .git

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
